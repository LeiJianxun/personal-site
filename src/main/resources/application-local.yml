server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/${DB_NAME}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health